<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="How to Record Basketball Practice Alone: A Repeatable Setup"><title>How to Record Basketball Practice Alone: A Repeatable Setup</title><rect width="1200" height="800" fill="#f1eddf"/><g font-family="Arial, Helvetica, sans-serif"><text x="65" y="80" fill="#ad4726" font-size="16" >THE HOOPCUT PLAYBOOK / ORIGINAL PLANNING DIAGRAM</text><text x="65" y="150" fill="#242d26" font-size="43" >One drill. One repeatable frame.</text><g stroke="#506248" stroke-width="3" fill="none"><rect x="180" y="245" width="840" height="410"/><path d="M 600 245 V 655"/><circle cx="600" cy="450" r="70"/><rect x="180" y="355" width="150" height="190"/><rect x="870" y="355" width="150" height="190"/><circle cx="225" cy="450" r="20"/><circle cx="975" cy="450" r="20"/></g><path d="M 650 695 L 810 335 L 1020 535 Z" fill="#ad47261a" stroke="#ad4726" stroke-dasharray="10 8"/><circle cx="850" cy="470" r="18" fill="#ad4726"/><text x="70" y="220" fill="#242d26" font-size="22" >Keep start, release and finish visible</text><text x="70" y="710" fill="#242d26" font-size="20" >Phone outside the run and rebound paths</text></g></svg>